apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hello
  namespace: nginx-review
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-hello
  template:
    metadata:
      labels:
        app: nginx-hello
    spec:
      containers:
        - name: nginx
          image: 510869689558.dkr.ecr.ap-southeast-2.amazonaws.com/nginx-hello-world:v1
          ports:
            - containerPort: 80
